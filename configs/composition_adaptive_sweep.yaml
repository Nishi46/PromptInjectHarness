# S6-02's adaptive composition sweep on the AgentDojo `workspace` suite.
# Copy of `configs/composition_static_sweep.yaml`'s `defenses:` list
# (top-4 solo + 8 composites, see that file's header and
# `docs/notes/composition.md`'s "S6-02 notes" for the ordering-independence
# reasoning), driven adaptively (`adaptive/trial.py`) instead of as single
# static episodes -- same design `configs/adaptive_sweep.yaml` (S4-05) and
# `configs/architectural_adaptive_sweep.yaml` (S5-05) already established.
# **Deliberately writes into that same `output.trace_db` path** as
# `configs/adaptive_sweep.yaml` -- the existing 6-defense adaptive trials
# already there become free comparison data, one SQL query away.
#
# `spotlighting+guard_model` listed first: the 1-trial sanity check below
# picks trial index 0, and needs to land on a `guard_model`-involving
# composite -- the one real per-tool-result model-call overhead among
# these defenses (structurally the same wall-clock risk `dual_llm` was in
# Sprint 5).
#
# Grid arithmetic (`injection_pareto adaptive-run` prints the real trial
# count from the actual config before running, but written out here so the
# multiplier is visible before running it at all):
#   12 defense entries x 5 families x 2 models x 1 task = 120 trials
#   120 trials x 20 rounds/trial (budget, before any early stop) = 2,400 episodes, worst case
#   + up to 1 extra mutator LLM call per round that doesn't succeed
#   + for the 5 `guard_model`-involving entries specifically: 1 extra
#     classifier-model call per tool result in every one of those episodes
# Every prior adaptive sweep in this project found ASR@1 == ASR@20 == 0.000
# against these two local models (`results/adaptive.md`,
# `docs/notes/architectural_defenses.md`'s S5-05 section is the one real
# exception found so far, and it didn't involve any of these 4 defenses) --
# meaning early stopping essentially never triggers, so budget the full
# worst-case episode count, not an optimistic early-stop estimate.

name: composition_adaptive_sweep

models:
  - id: L1
    provider: ollama
    model: llama3.2:3b
    digest: sha256:a80c4f17acd5
  - id: L2
    provider: ollama
    model: llama3.1:latest
    digest: sha256:46e0c10c039e

defenses:
  - spotlighting+guard_model
  - guard_model+spotlighting
  - spotlighting
  - instructional_prevention
  - guard_model
  - tool_allowlist
  - spotlighting+instructional_prevention
  - instructional_prevention+spotlighting
  - spotlighting+tool_allowlist
  - instructional_prevention+guard_model
  - instructional_prevention+tool_allowlist
  - guard_model+tool_allowlist

suites:
  - workspace

attacks:
  - naive
  - ignore_previous
  - important_instructions
  - context_completion
  - encoding_obfuscation

tasks:
  workspace:
    - user_task_0

injection_tasks:
  workspace: injection_task_0

output:
  trace_db: runs/local/adaptive_sweep/trace.db
