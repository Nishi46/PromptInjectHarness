# Sprint 4's adaptive-attack sweep on the MCP suite (S4-06): 6 defenses × 4
# poisoned-description sub-families × the same 2 local models validated in
# S2-11/S3-06/S4-05 × 1 task each, each point run as an up-to-20-round
# adaptive trial (`ADAPTIVE_ROUND_BUDGET`, `adaptive/trial.py`) instead of a
# single static episode -- the same "adaptive-run" design `adaptive_sweep.yaml`
# (S4-05) uses, just against `mcp_adapter.run_mcp_episode` instead of
# `agentdojo_adapter.run_episode`.
#
# Same one-representative-case-per-sub-family choice `mcp_sweep.yaml` (S3-06)
# already made -- reusing its exact 4 case IDs so this sweep is a direct
# adaptive-vs-static comparison against the same poisoned cases, not a
# different sample. `expand_adaptive_trial_points` reuses
# `config/loader.py::expand_run_specs`'s existing "mcp" branch as-is, which
# already filters `mcp_tasks` down to just the task mounting each case's
# `target_server` -- so each (defense, sub-family, model) point resolves to
# exactly 1 task, same as S3-06.
#
# No `null` (benign) pass here, same reasoning as `adaptive_sweep.yaml`:
# `expand_adaptive_trial_points` skips benign points entirely; reuse
# `mcp_sweep.yaml`'s own trace DB for the utility baseline.
#
# Grid arithmetic (`injection_pareto adaptive-run` prints the real trial
# count before running, but written out here so the multiplier is visible
# before running it at all):
#   6 defenses × 4 sub-families × 2 models × 1 task = 48 trials
#   48 trials × 20 rounds/trial (budget, before any early stop) = 960 episodes, worst case
#   + up to 1 extra mutator LLM call per round that doesn't succeed

name: adaptive_mcp_sweep

models:
  - id: L1
    provider: ollama
    model: llama3.2:3b
    digest: sha256:a80c4f17acd5
  - id: L2
    provider: ollama
    model: llama3.1:latest
    digest: sha256:46e0c10c039e

defenses:
  - no_defense
  - spotlighting
  - instructional_prevention
  - guard_model
  - canary
  - tool_allowlist

suites:
  - mcp

attacks:
  - direct_instruction
  - fake_usage_note
  - fake_precondition
  - cross_tool_redirection

tasks: {} # unused for the "mcp" suite (see mcp_tasks below); required key, kept empty

mcp_tasks:
  - mcp_file_storage_0
  - mcp_ticketing_0
  - mcp_crm_0
  - mcp_calendar_0
  - mcp_payments_0
  - mcp_code_search_0
  - mcp_analytics_0
  - mcp_email_0
  - mcp_messaging_0
  - mcp_project_management_0
  - mcp_hr_directory_0
  - mcp_cloud_infra_0
  - mcp_document_signing_0
  - mcp_expense_reporting_0
  - mcp_knowledge_base_0

mcp_poisoned_cases:
  direct_instruction: poison_direct_instruction_file_storage_list_files
  fake_usage_note: poison_fake_usage_note_email_get_email
  fake_precondition: poison_fake_precondition_payments_get_transaction
  cross_tool_redirection: poison_cross_tool_redirection_crm_search_contacts

output:
  trace_db: runs/local/adaptive_mcp_sweep/trace.db
