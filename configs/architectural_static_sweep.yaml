# S5-02/S5-05's D7 (and later D8) architectural-defense sweep on the
# AgentDojo `workspace` suite. Same models/tasks/attacks as
# `configs/static_sweep.yaml` (S2-11) -- only `defenses` differs -- and
# **deliberately writes into that same `output.trace_db` path**: the
# `no_defense` rows `static_sweep.yaml` already populated become this
# sweep's comparison baseline for free, rather than re-running a duplicate
# benign pass just to get a `no_defense` column to compare against.
#
# S5-02 ran only this config's benign (`attack: null`) points -- the
# utility-tax measurement -- with `defenses: [dual_llm]`. S5-05 adds
# `capability_enforcement` (now that S5-03/S5-04 have landed it) and runs
# the attacked points (all 5 families) for both defenses, appending to the
# same trace DB. Changing `defenses` changes this config's hash
# (`sweep/runner.py::_config_hash`), so the earlier `dual_llm` benign pass
# gets a fresh `run` row and re-executes here too -- a small, bounded,
# still-$0 duplication (6 episodes), not a bug: the alternative (a
# throwaway single-defense config just to avoid it) is more machinery than
# the reuse it would save. `dual_llm` listed first below is deliberate --
# S5-05's own 1-trial adaptive sanity check picks trial index 0, and
# `expand_run_specs`/`expand_adaptive_trial_points` iterate `defenses` in
# declaration order, so index 0 must land on `dual_llm`.

name: architectural_static_sweep

models:
  - id: L1
    provider: ollama
    model: llama3.2:3b
    digest: sha256:a80c4f17acd5
  - id: L2
    provider: ollama
    model: llama3.1:latest
    digest: sha256:46e0c10c039e

defenses:
  - dual_llm
  - capability_enforcement

suites:
  - workspace

attacks:
  - null # benign pass -- S5-02's utility-tax measurement, run now
  - naive
  - ignore_previous
  - important_instructions
  - context_completion
  - encoding_obfuscation

tasks:
  workspace:
    - user_task_0
    - user_task_1
    - user_task_3

injection_tasks:
  workspace: injection_task_0

output:
  trace_db: runs/local/static_sweep/trace.db
