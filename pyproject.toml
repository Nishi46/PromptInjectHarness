[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injection-pareto"
version = "0.1.0"
description = "Prompt-injection defense benchmarking harness"
requires-python = ">=3.11"
dependencies = [
    "agentdojo==0.1.35",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-requests",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/injection_pareto"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
