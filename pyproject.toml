[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injection-pareto"
version = "0.1.0"
description = "Prompt-injection defense benchmarking harness"
requires-python = ">=3.11"
dependencies = [
    "agentdojo==0.1.35",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-requests",
    "types-pyyaml",
    "types-tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["src/injection_pareto"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# agentdojo ships no py.typed marker (S1-01 risk note: their API is
# explicitly unstable) — every value from it is Any, checked at our
# boundary code instead (adapters/agentdojo_adapter.py).
module = "agentdojo.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
